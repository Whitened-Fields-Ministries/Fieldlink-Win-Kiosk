name: Build QA installer

# Every build is a QA build first. A push to main (or a manual run, from any
# branch) checks the app, builds the installer once and publishes it as the
# pre-release vX.Y.Z-qa. Only the QA FieldLink server offers a pre-release to
# its displays; production keeps handing out the last promoted build until
# "Promote to prod" (promote.yml) republishes these same bytes as vX.Y.Z.
#
# The version in package.json names the build. A push that changes the app
# without a new version fails here (scripts/qa-release-state.sh); a push that
# changes nothing in the app (docs, workflows) publishes nothing.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-qa
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_GET_TIMEOUT: '120000'

      - name: Syntax checks and unit tests
        run: npm run check && npm test
        shell: bash

      - name: Check the privileged helper (Windows PowerShell 5.1)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check-helper.ps1
        shell: bash

      # The real app in a real window on Windows: settings screen, display
      # scale, mouse pointer, corner hold.
      - name: Smoke test
        run: npm run smoke
        shell: bash

      - name: Publish or not?
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(scripts/qa-release-state.sh)
          version=$(node -p "require('./package.json').version")
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "FieldLinkKiosk $version: $state"

      - name: Build installer
        run: npm run build -- --publish never
        env:
          ELECTRON_GET_TIMEOUT: '120000'

      - name: Upload installer as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FieldLinkKiosk-installer
          path: dist/*.exe

      - name: Publish the QA pre-release
        if: steps.state.outputs.state == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.state.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          exe="dist/FieldLinkKiosk-Setup-$VERSION.exe"
          test -f "$exe"
          sha=$(sha256sum "$exe" | cut -d' ' -f1)
          {
            echo "QA build of FieldLinkKiosk $VERSION, built from \`$BRANCH\` at $GITHUB_SHA."
            echo
            echo "Only the QA FieldLink server offers this build to its displays. After testing, run **Promote to prod** with version \`$VERSION\` to publish the same file to production."
            echo
            echo "sha256 \`$sha\`"
          } > notes.md
          gh release create "v$VERSION-qa" "$exe" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "FieldLinkKiosk $VERSION (QA)" --notes-file notes.md
          {
            echo "## FieldLinkKiosk $VERSION published to QA"
            echo
            echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION-qa"
            echo "- sha256 \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to publish
        if: steps.state.outputs.state != 'publish'
        shell: bash
        run: echo "::notice::FieldLinkKiosk ${{ steps.state.outputs.version }} is already published from these app files; nothing new to publish."

      # The QA server caches which build it hands out; tell it now instead of
      # letting it find out within the hour. FIELDLINK_QA_SERVER_URL +
      # KIOSK_QA_WEBHOOK_SECRET (the same secrets the Pi kiosk repo uses).
      - name: Tell the QA server
        if: steps.state.outputs.state == 'publish'
        shell: pwsh
        env:
          QA_SERVER_URL: ${{ secrets.FIELDLINK_QA_SERVER_URL }}
          QA_WEBHOOK_SECRET: ${{ secrets.KIOSK_QA_WEBHOOK_SECRET }}
        run: |
          if (-not $env:QA_SERVER_URL -or -not $env:QA_WEBHOOK_SECRET) { Write-Host 'No QA server configured, skipping.'; exit 0 }
          try {
            Invoke-WebRequest -Uri "$($env:QA_SERVER_URL.TrimEnd('/'))/api/kiosk/installer/invalidate" `
              -Method POST `
              -Headers @{ "x-webhook-secret" = "$($env:QA_WEBHOOK_SECRET)"; "Content-Type" = "application/json" } `
              -UseBasicParsing | Out-Null
            Write-Host 'qa: cache invalidated'
          } catch {
            Write-Host "::warning::qa: cache invalidation skipped ($_); the server refreshes within an hour anyway"
          }

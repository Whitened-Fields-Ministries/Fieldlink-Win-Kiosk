name: Build Kiosk Installer

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build -- --publish never
        env:
          ELECTRON_GET_TIMEOUT: '120000'

      - name: Upload installer as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FieldLinkKiosk-installer
          path: dist/*.exe

      # The installer name carries the version, so without this the "latest"
      # release would accumulate one .exe per build and the FieldLink server
      # (which serves the release's installer) could hand out an old one.
      - name: Remove previous installers from the latest release
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $names = gh release view latest --repo $env:GITHUB_REPOSITORY --json assets -q '.assets[].name' 2>$null
          if (-not $names) { Write-Host 'No existing latest release or no assets.'; exit 0 }
          foreach ($n in $names) {
            if ($n -like '*.exe' -or $n -like '*.blockmap' -or $n -like '*.yml') {
              Write-Host "Deleting old asset $n"
              gh release delete-asset latest $n --repo $env:GITHUB_REPOSITORY --yes
            }
          }

      - name: Create or update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: latest
          name: FieldLinkKiosk Installer
          files: dist/*.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Both FieldLink servers cache which build they hand out (and what size and
      # sha256 to expect); a build replaces the asset under the same name, so a
      # server that is not told keeps describing the previous one and its next
      # download fails the size check. Same secret pairs as the Pi kiosk repo:
      # FIELDLINK_SERVER_URL + KIOSK_WEBHOOK_SECRET (prod) and
      # FIELDLINK_QA_SERVER_URL + KIOSK_QA_WEBHOOK_SECRET (QA). Unset pairs are skipped.
      - name: Invalidate the servers' installer cache
        if: success()
        run: |
          $pairs = @(
            @{ name = 'prod'; url = $env:SERVER_URL;    secret = $env:WEBHOOK_SECRET },
            @{ name = 'qa';   url = $env:QA_SERVER_URL; secret = $env:QA_WEBHOOK_SECRET }
          )
          foreach ($p in $pairs) {
            if (-not $p.url -or -not $p.secret) { Write-Host "No $($p.name) server configured, skipping."; continue }
            try {
              Invoke-WebRequest -Uri "$($p.url.TrimEnd('/'))/api/kiosk/installer/invalidate" `
                -Method POST `
                -Headers @{ "x-webhook-secret" = "$($p.secret)"; "Content-Type" = "application/json" } `
                -UseBasicParsing | Out-Null
              Write-Host "$($p.name): cache invalidated"
            } catch {
              Write-Host "::warning::$($p.name): cache invalidation skipped ($_); the server refreshes within an hour anyway"
            }
          }
        shell: pwsh
        env:
          SERVER_URL: ${{ secrets.FIELDLINK_SERVER_URL }}
          WEBHOOK_SECRET: ${{ secrets.KIOSK_WEBHOOK_SECRET }}
          QA_SERVER_URL: ${{ secrets.FIELDLINK_QA_SERVER_URL }}
          QA_WEBHOOK_SECRET: ${{ secrets.KIOSK_QA_WEBHOOK_SECRET }}
